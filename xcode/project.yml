# XcodeGen spec for the signed app bundle (D-03, D-04, D-05). All code lives in the SwiftPM package;
# this only wraps Sources/TransomApp + the TransomMac product. Generate with scripts/generate.sh.
name: Transom
packages:
  Transom:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    # Merged into the generated Info.plist: only CFBundleURLTypes, with the per-configuration TRANSOM_URL_SCHEME.
    INFOPLIST_FILE: Transom-Info.plist
    INFOPLIST_KEY_LSUIElement: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: S2K7P43927
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Transom:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - ../Sources/TransomApp
      # App icon and the menu-bar template glyphs (UI-SPEC Surface 8), copied from design-template/icons.
      - Assets.xcassets
    dependencies:
      - package: Transom
        product: TransomMac
      # The command-line tool (D-09). Never Contents/MacOS: on a case-insensitive volume it would be the Transom binary.
      - target: transom-tool
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    entitlements:
      # XcodeGen rewrites this file from `properties` on every generate. AX needs no sandbox.
      path: Transom.entitlements
      properties:
        com.apple.security.app-sandbox: false
    scheme: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_NAME: "Transom Debug"
          PRODUCT_BUNDLE_IDENTIFIER: com.eightabyte.transom.debug
          # Debug registers its own scheme so LaunchServices never routes a URL to the wrong build (A8).
          TRANSOM_URL_SCHEME: transom-debug
        Release:
          PRODUCT_NAME: Transom
          PRODUCT_BUNDLE_IDENTIFIER: com.eightabyte.transom
          TRANSOM_URL_SCHEME: transom
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          # No debugger-attach (get-task-allow) entitlement in Release (T-02-05).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # Notarisation needs a secure timestamp; Debug stays fast and offline.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  # Named apart from the Transom target and the package's transom-cli target: their build folders would collide.
  transom-tool:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - ../Sources/transom-cli
    dependencies:
      - package: Transom
        product: TransomEngine
    settings:
      base:
        PRODUCT_NAME: transom
        PRODUCT_MODULE_NAME: transom_tool
        PRODUCT_BUNDLE_IDENTIFIER: com.eightabyte.transom.cli
        # Without a file of its own Xcode signs in com.apple.application-identifier, which needs a provisioning profile.
        CODE_SIGN_ENTITLEMENTS: Transom.entitlements
        # A tool has no bundle: its Info.plist goes in the binary, which gives the code signature the identifier above.
        INFOPLIST_FILE: ""
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      configs:
        Release:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          # Notarisation refuses the debugger-attach entitlement and needs a secure timestamp on every executable.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
