<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/>
      <stop offset="1" stop-color="#0D1118"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E8BFF"/>
      <stop offset="1" stop-color="#2E5AE0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#E8E5DD"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <mask id="muntins" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g stroke="#000" stroke-width="22" stroke-linecap="butt" fill="none">
        <circle cx="512" cy="392" r="82"/>
        <line x1="512" y1="392" x2="512" y2="150"/>
        <line x1="512" y1="392" x2="212" y2="92"/>
        <line x1="512" y1="392" x2="812" y2="92"/>
      </g>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <!-- transom: arched fanlight with radial muntins -->
  <path d="M212 370 V330 A300 118 0 0 1 812 330 V370 Q812 392 790 392 H234 Q212 392 212 370 Z" fill="url(#glass)" mask="url(#muntins)"/>
  <!-- tiled panes below -->
  <rect x="212" y="418" width="287" height="394" rx="26" fill="url(#pane)"/>
  <rect x="525" y="418" width="287" height="184" rx="26" fill="url(#pane)"/>
  <rect x="525" y="628" width="287" height="184" rx="26" fill="url(#pane)"/>
</svg>
