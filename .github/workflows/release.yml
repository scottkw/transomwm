name: Release

# A vX.Y.Z tag builds, signs, notarises and verifies the universal DMG and creates a DRAFT release;
# the maintainer publishes it (docs/releasing.md). workflow_dispatch is a dry run: the same build
# and checks, no release (D-11).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No environment, no secrets, a read-only token. Guards against mistakes, not attacks: a ref
  # carrying an edited release.yml skips it. The v* tag ruleset and the release environment's
  # required reviewer are the real control (docs/releasing.md).
  gate:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gate (version, main ancestry, no published release)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both events: a dry run signs and notarises too, so it may only build what is on main.
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          if [ "$EVENT" = push ]; then
            version=$(scripts/release-version.sh "$TAG")
            # A read-only token never sees drafts; the release job's first step checks those.
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "::error::release $TAG already exists; CI never replaces a release"
              exit 1
            fi
          else
            version=$(scripts/release-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The only job that sees the signing secrets. The keychain is deleted before swift test compiles
  # anything, so test code never runs next to the Developer ID key.
  release:
    needs: gate
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      # Drafts are visible only to a token with push access, so this runs here, not in gate. It also
      # catches "Re-run failed jobs" after a draft was made, which skips the gate.
      - name: No existing release (drafts included)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$ids" ]; then
            echo "::error::a release or draft for $TAG already exists; delete it before re-running"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default Xcode moves with the image; pin it so a release builds with what CI tested.
      # XcodeGen is not on the image (RESEARCH Pitfall 11).
      - name: Xcode and XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
          if ! xcodegen --version | grep -qx 'Version: 2.46.0'; then
            echo "::error::xcodegen is $(xcodegen --version), expected Version: 2.46.0; Homebrew moved on, so check the new version and update this pin"
            exit 1
          fi

      # release.sh's spctl check only proves notarisation when assessments are on (Pitfall 14).
      - name: Gatekeeper assessments
        run: |
          if ! spctl --status 2>&1 | grep -q 'assessments enabled'; then
            sudo spctl --master-enable
          fi
          spctl --status 2>&1 | grep -q 'assessments enabled' || { echo "::error::Gatekeeper assessments are disabled on this runner"; exit 1; }

      # Never echo a variable here. The .p12 and .p8 are deleted as soon as they are imported.
      - name: Signing keychain and notary profile
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/transom-release.keychain-db"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          kc_pass=$(openssl rand -base64 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials transom-notary --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          if ! security find-identity -v -p codesigning "$keychain" | grep -qF '"Developer ID Application: Ken Scott (S2K7P43927)"'; then
            security find-identity -p codesigning "$keychain"
            echo "::error::Developer ID Application: Ken Scott (S2K7P43927) is not a valid identity (CSSMERR_TP_NOT_TRUSTED means the Developer ID G2 intermediate is missing on the runner)"
            exit 1
          fi
          # Exactly as release.sh calls it: no keychain flag.
          if ! xcrun notarytool history --keychain-profile transom-notary >/dev/null; then
            echo "::error::notarytool cannot find the transom-notary profile without a keychain flag"
            exit 1
          fi

      - name: Build, sign, notarise, staple, verify
        run: |
          TRANSOM_NOTARY_PROFILE=transom-notary scripts/release.sh
          test -f "build/Transom-$VERSION-universal.dmg.sha256" || { echo "::error::release.sh wrote no build/Transom-$VERSION-universal.dmg.sha256"; exit 1; }
          # Nothing after this step signs: drop the identity before swift test compiles anything.
          security delete-keychain "$RELEASE_KEYCHAIN"

      # The updater's own verifier must accept the shipped DMG (and reject a byte-flipped copy).
      - name: Updater accepts the DMG
        run: |
          mkdir -p build
          UPDATE_REAL_DMG="$PWD/build/Transom-$VERSION-universal.dmg" \
            swift test --filter UpdateRealDMGTests 2>&1 | tee build/update-verify.log
          # A filter that matched nothing also exits 0.
          grep -qE 'Test run with [1-9][0-9]* tests? in [0-9]+ suites? passed' build/update-verify.log \
            || { echo "::error::UpdateRealDMGTests did not run and pass"; exit 1; }

      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="build/Transom-$VERSION-universal.dmg"
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "Transom $VERSION" --notes-file "docs/release-notes-$VERSION.md" \
            "$dmg" "$dmg.sha256"

          got=$(gh release view "$TAG" --repo "$REPO" --json isDraft,name,assets \
            --jq '[(.isDraft | tostring), .name, ([.assets[].name] | sort | join(","))] | join("|")')
          want="true|Transom $VERSION|Transom-$VERSION-universal.dmg,Transom-$VERSION-universal.dmg.sha256"
          [ "$got" = "$want" ] || { echo "::error::draft is '$got', expected '$want'"; exit 1; }

      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: echo 'dry run, no release created'

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
